<!DOCTYPE html>
<html lang="en">
<head>

  <title>Staff Sign-in | D-TECH</title>
  <meta name="description" content="Sign-in for D-TECH staff to the website management console.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <!-- The console (/api/admin/console) replaces this page after sign-in and was
       styled on top of these stylesheets and icons, so keep them. -->
  <script src="/assets/lucide.min.js?v=d5638e66bc" defer></script>
  <link rel="stylesheet" href="/assets/bundle.min.css?v=6d409fb5cc">
  <link id="theme-dark-css" rel="stylesheet" href="/assets/skin-dark.min.css?v=721e3a7536">
  <link rel="stylesheet" href="/assets/fonts.min.css?v=98176d8aff" media="print" onload="this.media='all'">
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/Inter-var.woff2" crossorigin>
  <script>try{var __dt=localStorage.getItem('dtech-theme');if(__dt!=='light'&&__dt!=='dark'){try{__dt=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}catch(e){__dt='light';}}if(__dt!=='dark'){var __dl=document.getElementById('theme-dark-css');if(__dl){__dl.disabled=true;}}document.documentElement.setAttribute('data-theme',__dt);}catch(e){}</script>
  <style>
    body.dt-auth{--si-bg:#fff;--si-ink:#0f253b;--si-muted:#5b6f82;--si-line:#ccdee8;--si-field:#f7fafc;--si-accent:#0075ae;--si-accent-ink:#fff;--si-bad:#b42318;--si-bad-bg:#fef3f2;--si-ok:#067647;--si-ok-bg:#ecfdf3;--si-info:#0b4a6f;--si-info-bg:#eaf6fb;
      margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px 16px;box-sizing:border-box;
      /* !important: the site bundle sets body background and color with !important. */
      background:radial-gradient(900px 520px at 85% -10%,rgba(39,182,218,.22),transparent 60%),radial-gradient(700px 480px at -10% 110%,rgba(240,86,29,.12),transparent 60%),linear-gradient(160deg,#071d34 0%,#0b2f52 58%,#08223b 100%) !important;
      color:var(--si-ink) !important;font-family:Inter,system-ui,sans-serif}
    html[data-theme="dark"] body.dt-auth{--si-bg:#0b2238;--si-ink:#eef5fb;--si-muted:#a3b8ca;--si-line:#24445f;--si-field:#081a2c;--si-accent:#27b6da;--si-accent-ink:#071d34;--si-bad:#fda29b;--si-bad-bg:rgba(180,35,24,.18);--si-ok:#75e0a7;--si-ok-bg:rgba(6,118,71,.2);--si-info:#9bd8ef;--si-info-bg:rgba(39,182,218,.14)}
    .dt-si-card{width:min(420px,100%);box-sizing:border-box;background:var(--si-bg);border-top:4px solid #f0561d;border-radius:18px;padding:28px 24px 22px;box-shadow:0 30px 70px -20px rgba(0,0,0,.6)}
    .dt-si-logo{display:inline-flex;background:#fff;border-radius:10px;padding:7px 11px;box-shadow:inset 0 0 0 1px rgba(15,37,59,.08)}
    .dt-si-logo img{display:block;height:32px;width:auto}
    .dt-si-card h1{margin:20px 0 2px;font-size:22px;line-height:1.25;font-weight:800;letter-spacing:-.01em;color:var(--si-ink)}
    .dt-si-sub{margin:0 0 22px;font-size:14px;color:var(--si-muted)}
    .dt-si-card label{display:block;font-size:13px;font-weight:700;margin:0 0 6px;color:var(--si-ink)}
    .dt-si-field{display:flex;align-items:stretch;border:1px solid var(--si-line);border-radius:10px;background:var(--si-field);margin-bottom:16px;transition:border-color .15s,box-shadow .15s}
    .dt-si-field:focus-within{border-color:var(--si-accent);box-shadow:0 0 0 3px rgba(39,182,218,.25)}
    .dt-si-field.is-bad{border-color:var(--si-bad)}
    .dt-si-field input{flex:1;min-width:0;border:0;background:transparent;color:var(--si-ink);font:500 16px/1.4 Inter,system-ui,sans-serif;padding:11px 12px;outline:0}
    .dt-si-field input:disabled{opacity:.6}
    .dt-si-peek{border:0;border-left:1px solid var(--si-line);background:transparent;color:var(--si-muted);font:600 12px/1 Inter,system-ui,sans-serif;padding:0 14px;cursor:pointer;border-radius:0 10px 10px 0}
    .dt-si-peek:hover{color:var(--si-ink)}
    .dt-si-msg{margin:-4px 0 14px;font-size:13px;line-height:1.45;border-radius:8px}
    .dt-si-msg:empty{display:none}
    .dt-si-msg:not(:empty){padding:9px 11px}
    .dt-si-msg[data-tone="bad"]{background:var(--si-bad-bg);color:var(--si-bad)}
    .dt-si-msg[data-tone="ok"]{background:var(--si-ok-bg);color:var(--si-ok)}
    .dt-si-msg[data-tone="info"]{background:var(--si-info-bg);color:var(--si-info)}
    .dt-si-submit{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--si-accent);background:var(--si-accent);color:var(--si-accent-ink);border-radius:10px;padding:12px 16px;font:700 15px/1 Inter,system-ui,sans-serif;cursor:pointer}
    .dt-si-submit:hover{filter:brightness(1.08)}
    .dt-si-submit:disabled{opacity:.6;cursor:not-allowed;filter:none}
    .dt-si-submit:focus-visible,.dt-si-peek:focus-visible,.dt-si-back:focus-visible{outline:2px solid var(--si-accent);outline-offset:2px}
    .dt-si-spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:dt-si-spin .7s linear infinite}
    .dt-si-help{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--si-line);font-size:12px;line-height:1.5;color:var(--si-muted)}
    .dt-si-foot{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:#a3b8ca;text-align:center}
    .dt-si-back{color:#dbeaf5;text-decoration:none;font-weight:600}
    .dt-si-back:hover{color:#fff;text-decoration:underline;text-underline-offset:3px}
    @keyframes dt-si-spin{to{transform:rotate(360deg)}}
    @keyframes dt-si-shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
    @media (prefers-reduced-motion:no-preference){.dt-si-card.is-shake{animation:dt-si-shake .35s ease}}
    @media (prefers-reduced-motion:reduce){.dt-si-spin{animation-duration:2s}}
  </style>
</head>
<body class="dt-auth">
  <main class="dt-si-card" id="dt-si-card" aria-labelledby="dt-si-title">
    <a class="dt-si-logo" href="/" aria-label="D-TECH home"><img src="/assets/dtech-logo-blue.webp" width="324" height="142" alt="D-TECH"></a>
    <h1 id="dt-si-title">Staff sign-in</h1>
    <p class="dt-si-sub">D-TECH website management console</p>
    <!-- method="post" keeps the password out of the URL even if scripts fail to load. -->
    <form id="dt-si-form" method="post" novalidate>
      <label for="dt-si-id">Admin ID</label>
      <div class="dt-si-field"><input id="dt-si-id" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" aria-describedby="dt-si-msg"></div>
      <label for="dt-si-key">Password</label>
      <div class="dt-si-field"><input id="dt-si-key" name="password" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" aria-describedby="dt-si-msg dt-si-help">
        <button type="button" class="dt-si-peek" id="dt-si-peek" aria-controls="dt-si-key" aria-pressed="false">Show</button></div>
      <p id="dt-si-msg" class="dt-si-msg" role="status" aria-live="polite"></p>
      <noscript><p class="dt-si-msg" data-tone="bad">Turn on JavaScript to sign in.</p></noscript>
      <button type="submit" class="dt-si-submit" id="dt-si-submit">Sign in</button>
      <p id="dt-si-help" class="dt-si-help">You stay signed in on this device for 8 hours. Forgotten your ID or password? Ask your website administrator.</p>
    </form>
  </main>
  <p class="dt-si-foot"><span>Restricted area for authorised D-TECH staff.</span><a class="dt-si-back" href="/">&larr; Back to the website</a></p>
<script>
  (function () {
    // Staff sign-in. The password is only ever posted to /api/admin/auth, never
    // put in a URL or stored in the browser. Once signed in, the console script
    // (/api/admin/console) replaces this page.
    var AUTH = '/api/admin/auth';
    var PAUSE_MS = 15 * 60 * 1000; // matches the server's limit: 5 tries per 15 minutes
    var MAX_TRIES = 5;
    var MEMORY = 'dt-signin';
    var NOTES = {
      'signed-out': ['You have signed out. See you next time.', 'ok'],
      'session-ended': ['Your session has ended. Please sign in again.', 'info']
    };
    var card = document.getElementById('dt-si-card');
    var form = document.getElementById('dt-si-form');
    var idInput = document.getElementById('dt-si-id');
    var keyInput = document.getElementById('dt-si-key');
    var peek = document.getElementById('dt-si-peek');
    var msg = document.getElementById('dt-si-msg');
    var submitBtn = document.getElementById('dt-si-submit');
    var started = false, countdown;

    function start() {
      if (started) return;
      started = true;
      var app = document.createElement('script');
      app.src = '/api/admin/console';
      app.onerror = function () {
        started = false;
        busy(false);
        say('You are signed in, but the console could not load. Check your connection and reload the page.', 'bad');
      };
      document.body.appendChild(app);
    }

    // Wrong tries are remembered for 15 minutes so the pause survives a reload; the
    // server enforces the real limit either way.
    function memory() {
      try {
        var m = JSON.parse(localStorage.getItem(MEMORY) || '{}');
        var now = Date.now();
        return { tries: (m.tries || []).filter(function (t) { return now - t < PAUSE_MS; }), until: m.until > now ? m.until : 0 };
      } catch (e) {
        return { tries: [], until: 0 }; // storage blocked: rely on the server's limit
      }
    }
    function remember(m) {
      try { localStorage.setItem(MEMORY, JSON.stringify(m)); } catch (e) { console.warn('Sign-in attempts not remembered:', e.message); }
    }

    // fields: the inputs to mark as wrong (only when tone is "bad").
    function say(text, tone, fields) {
      msg.textContent = text || '';
      if (tone) msg.setAttribute('data-tone', tone); else msg.removeAttribute('data-tone');
      [idInput, keyInput].forEach(function (el) {
        var bad = tone === 'bad' && (fields || []).indexOf(el) > -1;
        el.parentNode.classList.toggle('is-bad', bad);
        el.setAttribute('aria-invalid', bad ? 'true' : 'false');
      });
    }

    function lock(on) {
      idInput.disabled = on;
      keyInput.disabled = on;
      peek.disabled = on;
      submitBtn.disabled = on;
    }

    function busy(on, label) {
      lock(on);
      submitBtn.innerHTML = on ? '<span class="dt-si-spin" aria-hidden="true"></span>' + (label || 'Checking…') : 'Sign in';
    }

    function paused() {
      clearInterval(countdown);
      var until = memory().until;
      if (!until) return false;
      lock(true);
      function tick() {
        var left = until - Date.now();
        if (left <= 0) {
          clearInterval(countdown);
          lock(false);
          say('You can try again now.', 'info');
          idInput.focus();
          return;
        }
        var s = Math.ceil(left / 1000);
        say('Too many wrong attempts, so sign-in is paused for security. Try again in ' + Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2) + '.', 'bad');
      }
      tick();
      countdown = setInterval(tick, 1000);
      return true;
    }

    function wrongCredentials() {
      var m = memory();
      m.tries.push(Date.now());
      if (m.tries.length >= MAX_TRIES) m.until = Date.now() + PAUSE_MS;
      remember(m);
      if (paused()) return;
      var left = MAX_TRIES - m.tries.length;
      say('That admin ID and password do not match. Check for typos or extra spaces and try again.' +
        (left <= 2 ? ' ' + left + (left === 1 ? ' try' : ' tries') + ' left before sign-in pauses for 15 minutes.' : ''), 'bad', [idInput, keyInput]);
      card.classList.remove('is-shake');
      void card.offsetWidth;
      card.classList.add('is-shake');
      keyInput.select();
    }

    function submit(event) {
      event.preventDefault();
      if (paused()) return;
      var id = idInput.value.trim();
      var key = keyInput.value;
      if (!id) { say('Please enter your admin ID.', 'bad', [idInput]); idInput.focus(); return; }
      if (!key) { say('Please enter your password.', 'bad', [keyInput]); keyInput.focus(); return; }
      busy(true);
      say('', '');
      fetch(AUTH, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id, key: key }) })
        .then(function (r) {
          if (r.ok) {
            remember({ tries: [], until: 0 });
            keyInput.value = '';
            busy(true, 'Opening…');
            say('Signed in. Opening the console…', 'ok');
            start();
            return;
          }
          busy(false);
          if (r.status === 429) {
            var m = memory();
            m.until = Date.now() + PAUSE_MS;
            remember(m);
            paused();
          } else if (r.status === 401) {
            wrongCredentials();
          } else if (r.status === 404) {
            say('Staff sign-in is not switched on for this website yet. Please ask your website administrator.', 'bad');
          } else {
            say('Sign-in is not available right now. Please try again in a minute.', 'bad');
          }
        }, function () {
          busy(false);
          say('Cannot reach the server. Check your internet connection and try again.', 'bad');
        });
    }

    form.addEventListener('submit', submit);
    peek.addEventListener('click', function () {
      var show = keyInput.type === 'password';
      keyInput.type = show ? 'text' : 'password';
      peek.textContent = show ? 'Hide' : 'Show';
      peek.setAttribute('aria-pressed', String(show));
      keyInput.focus();
    });

    // Old bookmarks may carry a passkey as #key= / ?key=; drop it from the address
    // bar and history without using it.
    var hash = location.hash.slice(1);
    var note = Object.prototype.hasOwnProperty.call(NOTES, hash) ? NOTES[hash] : null;
    if (/[?#&]key=/.test(location.search + location.hash) || location.hash) history.replaceState(null, '', location.pathname);

    busy(true);
    fetch(AUTH, { credentials: 'same-origin' }).then(function (r) {
      if (r.ok) {
        busy(true, 'Opening…');
        say('You are already signed in. Opening the console…', 'ok');
        return start();
      }
      busy(false);
      if (note) say(note[0], note[1]);
      if (!paused()) idInput.focus();
    }, function (err) {
      console.warn(err.message);
      busy(false);
      say('Cannot reach the server. Check your internet connection and try again.', 'bad');
    });
  })();
</script>
</body>
</html>

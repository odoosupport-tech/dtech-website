<!DOCTYPE html>
<!-- Source for assets/og-image.png (1200×630). Re-render with tools/og/render.mjs. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;font-family:Inter,sans-serif;color:#fff;
    background:#04121f;position:relative}
  .bg{position:absolute;inset:0;
    background:
      radial-gradient(45% 60% at 85% 10%,rgba(39,182,218,.38),transparent 70%),
      radial-gradient(40% 55% at 5% 100%,rgba(0,140,207,.25),transparent 70%),
      repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 60px),
      repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 60px)}
  .wrap{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
  .logo{height:62px;filter:invert(1) brightness(1.7);align-self:flex-start}
  .eyebrow{margin-top:auto;display:flex;align-items:center;gap:12px;font:600 17px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#3fc6e6}
  .eyebrow i{width:10px;height:10px;border-radius:50%;background:#35c98b;box-shadow:0 0 0 6px rgba(53,201,139,.18)}
  h1{margin-top:22px;font-weight:800;font-size:84px;line-height:1.02;letter-spacing:-.035em}
  h1 em{font-style:normal;color:#3fc6e6}
  .foot{margin-top:34px;display:flex;gap:14px;align-items:center}
  .chip{padding:11px 18px;border-radius:999px;border:1px solid rgba(63,198,230,.35);background:rgba(63,198,230,.1);font:700 17px/1 Inter;letter-spacing:.02em;color:#dff4fb}
  .rule{position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,#27b6da,#2cb67d,#ff7a1a,#ef3d2f)}
</style></head><body>
<div class="bg"></div>
<div class="wrap">
  <img class="logo" src="../../assets/dtech-logo.png" alt="">
  <div class="eyebrow"><i></i>TURNKEY SYSTEMS INTEGRATION · SINCE 1999</div>
  <h1>Complex systems.<br>Precisely <em>integrated.</em></h1>
  <div class="foot"><span class="chip">Industrial IT</span><span class="chip">Automation</span><span class="chip">Safety &amp; security</span><span class="chip">ISO 9001:2015</span></div>
</div>
<div class="rule"></div>
</body></html>

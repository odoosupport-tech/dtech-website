<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Automatic fallback flow: send on WhatsApp, then SMS if unread, then email if not delivered, with a chatbot handing over to an agent</title>
  <defs>
    <clipPath id="f"><rect width="480" height="360" rx="16"/></clipPath>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#7d93a7"/></marker>
  </defs>
  <g clip-path="url(#f)">
    <rect width="480" height="360" fill="#f3f7fb"/>
    <g fill="#d6e3ee"><circle cx="20" cy="20" r="1.5"/><circle cx="460" cy="340" r="1.5"/></g>
    <text x="24" y="38" font-size="11" font-weight="700" fill="#576e82" letter-spacing=".8">FLOW: ORDER REMINDER</text>
    <rect x="24" y="56" width="132" height="56" rx="12" fill="#fff" stroke="#25d366" stroke-width="2"/>
    <circle cx="46" cy="84" r="11" fill="#25d366"/><path d="M41 84a5 5 0 1 1 2 4l-3 1 1-3" stroke="#fff" stroke-width="1.6" fill="none"/>
    <text x="64" y="80" font-size="12.5" font-weight="700" fill="#0f253b">WhatsApp</text>
    <text x="64" y="97" font-size="11" fill="#576e82">Send reminder</text>
    <path d="M156 84h40" stroke="#7d93a7" stroke-width="2" marker-end="url(#a)"/>
    <path d="M240 58l42 26-42 26-42-26z" fill="#fff" stroke="#c3d6e4" stroke-width="2"/>
    <text x="240" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#0f253b">Read in</text>
    <text x="240" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#0f253b">2 hours?</text>
    <path d="M282 84h40" stroke="#2cb67d" stroke-width="2" marker-end="url(#a)"/>
    <text x="302" y="76" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2cb67d">Yes</text>
    <rect x="324" y="62" width="132" height="44" rx="22" fill="#e7f7f0" stroke="#2cb67d" stroke-width="2"/>
    <text x="390" y="89" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d7f56">Done ✓</text>
    <path d="M240 110v36" stroke="#e5484d" stroke-width="2" marker-end="url(#a)"/>
    <text x="250" y="132" font-size="10.5" font-weight="700" fill="#e5484d">No</text>
    <rect x="174" y="148" width="132" height="56" rx="12" fill="#fff" stroke="#0075ae" stroke-width="2"/>
    <circle cx="196" cy="176" r="11" fill="#0075ae"/><rect x="190" y="171" width="12" height="9" rx="2" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="214" y="172" font-size="12.5" font-weight="700" fill="#0f253b">SMS</text>
    <text x="214" y="189" font-size="11" fill="#576e82">Same reminder</text>
    <path d="M240 204v36" stroke="#e5484d" stroke-width="2" marker-end="url(#a)"/>
    <text x="250" y="226" font-size="10.5" font-weight="700" fill="#e5484d">Not delivered</text>
    <rect x="174" y="242" width="132" height="56" rx="12" fill="#fff" stroke="#ff7a1a" stroke-width="2"/>
    <circle cx="196" cy="270" r="11" fill="#ff7a1a"/><path d="M190 266h12v9h-12zM190 266l6 5 6-5" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="214" y="266" font-size="12.5" font-weight="700" fill="#0f253b">Email</text>
    <text x="214" y="283" font-size="11" fill="#576e82">With invoice</text>
    <rect x="24" y="166" width="124" height="132" rx="14" fill="#fff" stroke="#d6e3ee"/>
    <text x="40" y="190" font-size="11" font-weight="700" fill="#576e82" letter-spacing=".8">CHATBOT</text>
    <rect x="40" y="200" width="92" height="24" rx="12" fill="#e8f6fb"/><text x="86" y="216" text-anchor="middle" font-size="11" fill="#0075ae">Track order</text>
    <rect x="40" y="230" width="92" height="24" rx="12" fill="#e8f6fb"/><text x="86" y="246" text-anchor="middle" font-size="11" fill="#0075ae">Pay now</text>
    <rect x="40" y="260" width="92" height="24" rx="12" fill="#0075ae"/><text x="86" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Agent</text>
    <rect x="324" y="166" width="132" height="132" rx="14" fill="#fff" stroke="#d6e3ee"/>
    <text x="340" y="190" font-size="11" font-weight="700" fill="#576e82" letter-spacing=".8">TEAM INBOX</text>
    <circle cx="350" cy="216" r="11" fill="#f4c7a1"/><rect x="368" y="208" width="72" height="8" rx="4" fill="#d6e3ee"/><rect x="368" y="220" width="48" height="6" rx="3" fill="#e8eef4"/>
    <circle cx="350" cy="248" r="11" fill="#b9d8f0"/><rect x="368" y="240" width="72" height="8" rx="4" fill="#d6e3ee"/><rect x="368" y="252" width="40" height="6" rx="3" fill="#e8eef4"/>
    <rect x="340" y="268" width="100" height="20" rx="10" fill="#fff1e6"/><text x="390" y="282" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c25500">Hot lead</text>
    <path d="M132 272c80 60 160 60 192-10" stroke="#7d93a7" stroke-width="1.6" stroke-dasharray="4 4" fill="none" marker-end="url(#a)"/>
    <text x="240" y="336" text-anchor="middle" font-size="10.5" fill="#576e82">Hand-over to a person</text>
  </g>
</svg>

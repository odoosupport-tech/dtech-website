<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Automated voice call: an appointment reminder asking the listener to press 1 to confirm</title>
  <defs>
    <clipPath id="f"><rect width="480" height="360" rx="16"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f253b"/><stop offset="1" stop-color="#0b3a5c"/></linearGradient>
  </defs>
  <g clip-path="url(#f)">
    <rect width="480" height="360" fill="url(#bg)"/>
    <text x="32" y="48" font-size="12" font-weight="600" fill="#7fd3ea" letter-spacing="1">AUTOMATED CALL</text>
    <text x="32" y="80" font-size="24" font-weight="700" fill="#fff">Your Brand</text>
    <text x="32" y="104" font-size="13" fill="#a9c3d8">+91 22 4000 1234 · 00:12</text>
    <g fill="#27b6da">
      <rect x="32" y="138" width="6" height="16" rx="3"/><rect x="44" y="130" width="6" height="32" rx="3"/><rect x="56" y="122" width="6" height="48" rx="3"/><rect x="68" y="132" width="6" height="28" rx="3"/><rect x="80" y="126" width="6" height="40" rx="3"/><rect x="92" y="136" width="6" height="20" rx="3"/><rect x="104" y="128" width="6" height="36" rx="3"/><rect x="116" y="134" width="6" height="24" rx="3"/><rect x="128" y="140" width="6" height="12" rx="3"/><rect x="140" y="131" width="6" height="30" rx="3"/><rect x="152" y="137" width="6" height="18" rx="3"/>
    </g>
    <rect x="32" y="190" width="232" height="104" rx="14" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
    <text x="48" y="216" font-size="13" fill="#e6f1f8">“Your appointment is tomorrow</text>
    <text x="48" y="236" font-size="13" fill="#e6f1f8">at 11 am. Press 1 to confirm,</text>
    <text x="48" y="256" font-size="13" fill="#e6f1f8">2 to change the time, or 9 to</text>
    <text x="48" y="276" font-size="13" fill="#e6f1f8">speak to our team.”</text>
    <g font-size="17" font-weight="600" text-anchor="middle" fill="#fff">
      <circle cx="320" cy="62" r="24" fill="#27b6da"/><text x="320" y="68">1</text>
      <circle cx="380" cy="62" r="24" fill="#ffffff" fill-opacity=".12"/><text x="380" y="68">2</text>
      <circle cx="440" cy="62" r="24" fill="#ffffff" fill-opacity=".12"/><text x="440" y="68">3</text>
      <circle cx="320" cy="122" r="24" fill="#ffffff" fill-opacity=".12"/><text x="320" y="128">4</text>
      <circle cx="380" cy="122" r="24" fill="#ffffff" fill-opacity=".12"/><text x="380" y="128">5</text>
      <circle cx="440" cy="122" r="24" fill="#ffffff" fill-opacity=".12"/><text x="440" y="128">6</text>
      <circle cx="320" cy="182" r="24" fill="#ffffff" fill-opacity=".12"/><text x="320" y="188">7</text>
      <circle cx="380" cy="182" r="24" fill="#ffffff" fill-opacity=".12"/><text x="380" y="188">8</text>
      <circle cx="440" cy="182" r="24" fill="#ffffff" fill-opacity=".12"/><text x="440" y="188">9</text>
      <circle cx="320" cy="242" r="24" fill="#ffffff" fill-opacity=".12"/><text x="320" y="248">*</text>
      <circle cx="380" cy="242" r="24" fill="#ffffff" fill-opacity=".12"/><text x="380" y="248">0</text>
      <circle cx="440" cy="242" r="24" fill="#ffffff" fill-opacity=".12"/><text x="440" y="248">#</text>
    </g>
    <text x="320" y="20" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7fd3ea">PRESSED</text>
    <circle cx="380" cy="314" r="24" fill="#e5484d"/>
    <path d="M368 316c8-7 16-7 24 0l-3 4-5-2v-3c-3-1-5-1-8 0v3l-5 2z" fill="#fff"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">SMS inbox: an OTP, a shipping alert with a short link and an offer from the sender Your Brand</title>
  <defs><clipPath id="f"><rect width="480" height="360" rx="16"/></clipPath></defs>
  <g clip-path="url(#f)">
    <rect width="480" height="360" fill="#fff"/>
    <rect width="480" height="60" fill="#f6f8fa"/>
    <line x1="0" y1="60" x2="480" y2="60" stroke="#e4e9ee"/>
    <path d="M24 30l8-8M24 30l8 8" stroke="#0f253b" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="62" cy="30" r="18" fill="#0075ae"/>
    <path d="M53 25h18v12H53z" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M53 25l9 7 9-7" fill="none" stroke="#fff" stroke-width="1.8"/>
    <text x="90" y="27" font-size="15" font-weight="700" fill="#0f253b">VM-YRBRND</text>
    <text x="90" y="45" font-size="11.5" fill="#576e82">Text message · Your Brand</text>
    <rect x="207" y="72" width="66" height="20" rx="10" fill="#eef2f6"/>
    <text x="240" y="86" text-anchor="middle" font-size="11" fill="#576e82">Today</text>
    <rect x="16" y="104" width="340" height="58" rx="14" fill="#e9ecef"/>
    <text x="30" y="127" font-size="13" fill="#0f253b"><tspan font-weight="700">482913</tspan> is your OTP to log in to Your</text>
    <text x="30" y="147" font-size="13" fill="#0f253b">Brand. Valid for 10 minutes. Do not share it.</text>
    <rect x="16" y="172" width="340" height="58" rx="14" fill="#e9ecef"/>
    <text x="30" y="195" font-size="13" fill="#0f253b">Order #1042 has shipped. Track it here:</text>
    <text x="30" y="215" font-size="13" fill="#0075ae" text-decoration="underline">ybr.in/t/8Kd2</text>
    <rect x="16" y="240" width="340" height="58" rx="14" fill="#e9ecef"/>
    <text x="30" y="263" font-size="13" fill="#0f253b">Festive offer: 20% off all orders till</text>
    <text x="30" y="283" font-size="13" fill="#0f253b">Sunday. Shop now: <tspan fill="#0075ae" text-decoration="underline">ybr.in/d20</tspan></text>
    <path d="M358 210h8" stroke="#27b6da" stroke-width="2" stroke-dasharray="2 2"/>
    <rect x="366" y="188" width="100" height="44" rx="10" fill="#27b6da"/>
    <text x="416" y="206" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">Link tracked</text>
    <text x="416" y="222" text-anchor="middle" font-size="10.5" fill="#fff">3 clicks</text>
    <rect x="12" y="312" width="456" height="36" rx="18" fill="#f1f4f7"/>
    <text x="32" y="335" font-size="13" fill="#8a9bab">Text message</text>
  </g>
</svg>

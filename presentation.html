  <script>
    (function () {
      'use strict';
      var stage = document.getElementById('deck-stage');
      var full = document.getElementById('deck-full');

      function label() {
        full.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
      }

      function toggleFull() {
        // Full-screen the stage rather than the whole document, so the deck
        // fills the display without the site chrome around it.
        if (document.fullscreenElement) {
          if (document.exitFullscreen) document.exitFullscreen();
        } else if (stage.requestFullscreen) {
          stage.requestFullscreen();
        } else if (stage.webkitRequestFullscreen) {
          stage.webkitRequestFullscreen();
        }
      }

      full.addEventListener('click', toggleFull);
      document.addEventListener('fullscreenchange', label);
      document.addEventListener('webkitfullscreenchange', label);

      document.addEventListener('keydown', function (event) {
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        var tag = (event.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea') return;
        if (event.key === 'f' || event.key === 'F') { event.preventDefault(); toggleFull(); }
      });

      // The site opens this page in its own tab. There, Exit closes the tab and
      // the visitor is back on the page they came from; if the browser refuses
      // (the page was reached some other way), Exit is an ordinary link.
      var exit = document.getElementById('deck-exit');
      exit.addEventListener('click', function (event) {
        if (history.length > 1) return;
        event.preventDefault();
        window.close();
        setTimeout(function () { location.href = exit.href; }, 150);
      });
    })();
